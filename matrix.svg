<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180">
<defs>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff66" stop-opacity="0"/><stop offset=".5" stop-color="#00ff66" stop-opacity=".95"/><stop offset="1" stop-color="#00ff66" stop-opacity="0"/></linearGradient>
  <pattern id="glyphs" width="34" height="180" patternUnits="userSpaceOnUse">
    <text x="5" y="18" fill="#00ff66" font-family="monospace" font-size="14">0<tspan x="5" dy="18">1</tspan><tspan x="5" dy="18">ア</tspan><tspan x="5" dy="18">1</tspan><tspan x="5" dy="18">B</tspan><tspan x="5" dy="18">0</tspan><tspan x="5" dy="18">ア</tspan><tspan x="5" dy="18">1</tspan><tspan x="5" dy="18">0</tspan><tspan x="5" dy="18">1</tspan>
      <animate attributeName="y" values="-180;180" dur="2.7s" repeatCount="indefinite"/>
    </text>
  </pattern>
  <pattern id="columns" width="113" height="180" patternUnits="userSpaceOnUse">
    <rect width="113" height="180" fill="url(#glyphs)"/>
    <rect x="0" width="34" height="180" fill="#00ff66" opacity=".08">
      <animate attributeName="x" values="0;70;0" dur="3.8s" repeatCount="indefinite"/>
    </rect>
  </pattern>
</defs>
<rect width="1200" height="180" rx="8" fill="#020806"/>
<rect x="250" width="700" height="180" fill="url(#columns)" opacity=".72"/>
<g font-family="monospace" font-size="15" fill="#00ff66">
  <text x="24" y="43">iboo@system:~$ whoami</text><text x="24" y="68" fill="#00f0ff">iboo</text>
  <text x="24" y="120">iboo@system:~$ <tspan>_</tspan><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></text>
  <text x="965" y="43">[ SYSTEM ] ONLINE</text><text x="965" y="72">[ MODE ] MATRIX</text><text x="965" y="101">[ STATUS ] READY</text>
</g>
<rect x="1" y="1" width="1198" height="178" rx="8" fill="none" stroke="#00f0ff" stroke-opacity=".7"/>
</svg>