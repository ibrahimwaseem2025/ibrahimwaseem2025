<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="auto" role="img" aria-label="Developer profile: rose with info panel">
  <defs>
    <linearGradient id="roseOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e85d75" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c94f7c" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="roseMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f28e9e" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e85d75" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="roseInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7a8b8"/>
      <stop offset="1" stop-color="#e85d75"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd49f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8fd49f" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <style>
    .m {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                   "Liberation Mono", "Noto Sans Mono CJK SC", "Microsoft YaHei", monospace;
    }
  </style>

  <!-- background -->
  <rect x="0" y="0" width="900" height="300" fill="#0d1117"/>

  <!-- stem -->
  <path d="M180 160 C 178 220, 182 260, 180 300"
        fill="none" stroke="#7fbf8f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- leaves -->
  <path d="M179 220 Q 140 210 125 250 Q 165 255 179 220 Z"
        fill="url(#leaf)" stroke="#7fbf8f" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M181 260 Q 220 250 235 290 Q 195 295 181 260 Z"
        fill="url(#leaf)" stroke="#7fbf8f" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- rose -->
  <g transform="translate(180,100)">
    <!-- outer petals -->
    <g fill="url(#roseOuter)" stroke="#a83a5c" stroke-width="1.2">
      <ellipse cx="0" cy="-40" rx="28" ry="45" />
      <ellipse cx="0" cy="-40" rx="28" ry="45" transform="rotate(60)" />
      <ellipse cx="0" cy="-40" rx="28" ry="45" transform="rotate(120)" />
      <ellipse cx="0" cy="-40" rx="28" ry="45" transform="rotate(180)" />
      <ellipse cx="0" cy="-40" rx="28" ry="45" transform="rotate(240)" />
      <ellipse cx="0" cy="-40" rx="28" ry="45" transform="rotate(300)" />
    </g>
    <!-- middle petals -->
    <g fill="url(#roseMid)" stroke="#c94f7c" stroke-width="1">
      <ellipse cx="0" cy="-30" rx="18" ry="30" />
      <ellipse cx="0" cy="-30" rx="18" ry="30" transform="rotate(72)" />
      <ellipse cx="0" cy="-30" rx="18" ry="30" transform="rotate(144)" />
      <ellipse cx="0" cy="-30" rx="18" ry="30" transform="rotate(216)" />
      <ellipse cx="0" cy="-30" rx="18" ry="30" transform="rotate(288)" />
    </g>
    <!-- inner petals / center -->
    <g fill="url(#roseInner)" stroke="#e85d75" stroke-width="0.8">
      <ellipse cx="0" cy="-18" rx="10" ry="16" />
      <ellipse cx="0" cy="-18" rx="10" ry="16" transform="rotate(120)" />
      <ellipse cx="0" cy="-18" rx="10" ry="16" transform="rotate(240)" />
    </g>
    <!-- center dot -->
    <circle r="5" fill="#a83a5c" />
  </g>

  <!-- info panel -->
  <g>
    <rect x="330" y="40" width="530" height="220" rx="12"
          fill="#ffffff" fill-opacity="0.03" stroke="#2e3440"/>

    <text class="m" x="355" y="80" font-size="15" fill="#e85d75">[ 程序员女侍 // DEV_ ]</text>
    <line x1="355" y1="100" x2="835" y2="100" stroke="#2e3440"/>

    <text class="m" x="355" y="135" font-size="14" fill="#d8dde8">
      <tspan fill="#7d8698">OPERATOR : </tspan>I.WASEEM // MALE // MALDIVES
    </text>
    <text class="m" x="355" y="170" font-size="14" fill="#d8dde8">
      <tspan fill="#7d8698">ROLE     : </tspan>SOFTWARE / SYSTEMS BUILDER
    </text>
    <text class="m" x="355" y="205" font-size="14" fill="#d8dde8">
      <tspan fill="#7d8698">HOST     : </tspan>I use Fedora BTW
    </text>
    <text class="m" x="355" y="240" font-size="14" fill="#d8dde8">
      <tspan fill="#7d8698">CORE     : </tspan>PYTHON // LARAVEL // REACT //
    </text>
  </g>
</svg>
