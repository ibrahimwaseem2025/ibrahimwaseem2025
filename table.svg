<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="auto" role="img" aria-label="Developer telemetry dashboard">
  <defs>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                     "Liberation Mono", "Noto Sans Mono CJK SC", "Microsoft YaHei", monospace;
      }
      .label { font-size: 12px; fill: #00f0ff; }
      .value { font-size: 12px; fill: #ffffff; }
      .green { font-size: 12px; fill: #00ff66; }
      .amber { font-size: 12px; fill: #f59e0b; }
      .pink  { font-size: 12px; fill: #ff007f; }
      .purple{ font-size: 12px; fill: #bf00ff; }
      .red   { font-size: 12px; fill: #ff0055; }
      .muted { font-size: 11px; fill: #8b949e; }
      .divider { font-size: 11px; fill: #008822; }
      .title { font-size: 13px; font-weight: bold; }
      .cookie-text { font-size: 9px; fill: #00ff66; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1000" height="800" fill="#050508"/>

  <!-- outer border -->
  <rect x="10" y="10" width="980" height="780" rx="4" fill="none" stroke="#00f0ff" stroke-width="2"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- SECTION 1: COOKIE_CACHE_TELEMETRY (UPGRADED) -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="20" y="20" width="960" height="175" rx="3" fill="#080c14" stroke="#00f0ff" stroke-opacity="0.33"/>

  <text class="mono title" x="32" y="42" fill="#a855f7">[ 饼干缓存 // COOKIE_CACHE_TELEMETRY ]</text>

  <!-- cookie 1 -->
  <g transform="translate(70, 80)">
    <circle r="28" fill="#c98a4b" stroke="#e0a35c" stroke-width="1.5"/>
    <!-- chocolate chips -->
