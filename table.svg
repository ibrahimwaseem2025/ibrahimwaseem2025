  <rect x="20" y="696" width="960" height="50" rx="3" fill="#050508" stroke="#00f0ff" stroke-opacity="0.2"/>
  <text class="mono" x="500" y="728" font-size="12" fill="#8b949e" text-anchor="middle">[ 系统消息 // SYS_MSG ] :: EOF // TRANSMISSION_COMPLETE // 传输结束</text>

