  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="20" y="440" width="470" height="220" rx="3" fill="#080c14" stroke="#00f0ff" stroke-opacity="0.33"/>
  <text class="mono title" x="32" y="462" fill="#00f0ff">[ 核心项目 // ACTIVE_PROJECTS ]</text>
  <line x1="32" y1="470" x2="478" y2="470" stroke="#8b949e" stroke-opacity="0.4" stroke-dasharray="2 2"/>

  <text class="mono amber" x="32" y="494" font-weight="bold">░░ HOUSING 4 RAAJJE</text>
  <text class="mono pink" x="235" y="494">[房屋管理]</text>
  <text class="mono muted" x="32" y="514">   └─ API // React // PostgreSQL</text>

  <text class="mono amber" x="32" y="544" font-weight="bold">░░ UNDERWATER DEBRIS</text>
  <text class="mono pink" x="235" y="544">[水下检测]</text>
  <text class="mono muted" x="32" y="564">   └─ YOLOv8 // FUnIE-GAN</text>


  <rect x="510" y="440" width="470" height="220" rx="3" fill="#080c14" stroke="#00f0ff" stroke-opacity="0.33"/>
