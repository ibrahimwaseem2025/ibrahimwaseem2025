  <line x1="522" y1="564" x2="968" y2="564" stroke="#8b949e" stroke-opacity="0.4" stroke-dasharray="2 2"/>

  <text class="mono label" x="522" y="588">传输 / STREAM   :</text>
  <text class="mono value" x="668" y="588">HYBRID_STACK</text>

  <text class="mono label" x="522" y="614">信号 / SIGNAL   :</text>
