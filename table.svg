    <circle cx="10" cy="-6" r="3" fill="#5c3a1e"/>
    <circle cx="-4" cy="8" r="3.5" fill="#5c3a1e"/>
    <circle cx="12" cy="10" r="2.8" fill="#5c3a1e"/>
    <circle cx="-12" cy="6" r="2.5" fill="#5c3a1e"/>
    <circle cx="2" cy="-2" r="2" fill="#5c3a1e"/>
    <!-- crumbs -->
