  <line x1="32" y1="254" x2="478" y2="254" stroke="#8b949e" stroke-opacity="0.4" stroke-dasharray="2 2"/>

  <text class="mono label" x="32" y="274">姓名 / NAME   :</text>
  <text class="mono value" x="175" y="274" fill="#ffffff">Ibrahim Waseem (iboo)</text>

