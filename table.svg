  <text class="mono label" x="522" y="276">PYTHON / DJANGO</text>
  <text class="mono amber" x="680" y="276">[████████████████████]</text>
  <text class="mono value" x="900" y="276">100%</text>

  <text class="mono label" x="522" y="300">DOCKER / PODMAN</text>
  <text class="mono amber" x="680" y="300">[████████████████░░░░]</text>
  <text class="mono value" x="900" y="300"> 85%</text>

  <text class="mono label" x="522" y="324">REACT / .NET API</text>
  <text class="mono amber" x="680" y="324">[██████████████░░░░░░]</text>
  <text class="mono value" x="900" y="324"> 75%</text>

  <text class="mono label" x="522" y="348">ML</text>
  <text class="mono amber" x="680" y="348">[██████████████████░░]</text>
  <text class="mono value" x="900" y="348"> 90%</text>

