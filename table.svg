    <circle cx="-10" cy="-8" r="3.2" fill="#6b4423"/>
    <circle cx="8" cy="-12" r="3.5" fill="#6b4423"/>
    <circle cx="-6" cy="10" r="3" fill="#6b4423"/>
    <circle cx="14" cy="6" r="3.2" fill="#6b4423"/>
    <circle cx="-14" cy="2" r="2.5" fill="#6b4423"/>
    <circle cx="4" cy="-2" r="2.2" fill="#6b4423"/>
    <circle cx="-16" cy="-16" r="1.4" fill="#6b4423" opacity="0.6"/>
    <circle cx="20" cy="-10" r="1.3" fill="#6b4423" opacity="0.6"/>
    <circle cx="18" cy="16" r="1.2" fill="#6b4423" opacity="0.6"/>
    <circle cx="-18" cy="14" r="1.1" fill="#6b4423" opacity="0.6"/>
