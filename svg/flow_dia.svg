<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="100%" height="auto" role="img" aria-label="Enhanced ML pipeline flow diagram with animations">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0707"/>
      <stop offset="100%" stop-color="#080606"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4545"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="headerLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ff4545" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="nodeBorderRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4545"/>
      <stop offset="100%" stop-color="#8c1717"/>
    </linearGradient>
    <linearGradient id="nodeBorderPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bf00ff"/>
      <stop offset="100%" stop-color="#6b1d99"/>
    </linearGradient>
    <linearGradient id="nodeBorderMixed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4545"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff4545"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a855f7"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c1717"/>
    </marker>

    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; }
      .panel-title { fill: #ff4444; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
      .panel-sub { fill: #bb77bb; font-size: 9px; letter-spacing: 0.5px; }
      .stage-name { fill: #ffffff; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; }
      .stage-sub { fill: #bb9999; font-size: 8px; }
      .stage-index { fill: #ff8888; font-size: 7px; letter-spacing: 1px; font-weight: 700; }
      .stage-metric { fill: #ffffff; font-size: 9px; font-weight: 600; }
      .muted { fill: #888888; font-size: 9px; letter-spacing: 0.5px; }
      .status-label { fill: #aa8888; font-size: 9px; letter-spacing: 2px; font-weight: 700; }
      .status-value { fill: #ffffff; font-size: 11px; font-weight: 600; }

      .scan { animation: scan 5s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 5 4; animation: flowDash 1.2s linear infinite; }
      .flow-line-slow { stroke-dasharray: 3 7; animation: flowDash 2s linear infinite; }
      .feedback-flow { stroke-dasharray: 4 6; animation: feedbackFlow 2s linear infinite; }
      .border-pulse { animation: borderPulse 3s ease-in-out infinite; }
      .metric-blink { animation: metricBlink 3s steps(1) infinite; }
      .pulse-dot { animation: pulseDot 2s ease-in-out infinite; }

      @keyframes scan { 0%,100%{opacity:.06} 50%{opacity:.28} }
      @keyframes flowDash { to { stroke-dashoffset: -18; } }
      @keyframes feedbackFlow { to { stroke-dashoffset: 10; } }
      @keyframes borderPulse { 0%,100%{stroke-opacity:.55} 50%{stroke-opacity:1} }
      @keyframes metricBlink { 0%,80%{opacity:1} 85%,90%{opacity:.35} 95%{opacity:1} }
      @keyframes pulseDot { 0%,100%{opacity:1} 50%{opacity:.25} }

      @media (prefers-reduced-motion: reduce) {
        .scan,.flow-line,.flow-line-slow,.feedback-flow,.border-pulse,.metric-blink,.pulse-dot { animation: none; }
      }
    </style>
  </defs>

  <!-- ═══════════ BACKGROUND ═══════════ -->
  <rect width="920" height="560" fill="#080808"/>
  <rect x="1" y="1" width="918" height="558" rx="8" fill="none" stroke="#351414"/>
  <g stroke="#ffffff" stroke-opacity=".022">
    <path d="M0 40H920 M0 80H920 M0 120H920 M0 160H920 M0 200H920
             M0 240H920 M0 280H920 M0 320H920 M0 360H920 M0 400H920
             M0 440H920 M0 480H920 M0 520H920"/>
  </g>
  <g class="scan" fill="#ff3333"><rect x="0" y="0" width="920" height="2"/></g>

  <!-- ═══════════ PANEL ═══════════ -->
  <rect x="16" y="16" width="888" height="528" rx="6" fill="url(#panelBg)" stroke="#351414"/>

  <!-- Header -->
  <text x="32" y="38" class="mono panel-title">[ PIPELINE_FLOW ]</text>
  <text x="888" y="38" class="mono panel-sub" text-anchor="end">data → model → service</text>
  <line x1="28" y1="46" x2="892" y2="46" stroke="url(#headerLine)"/>

  <!-- ═══════════ FEEDBACK LOOP (behind nodes) ═══════════ -->
  <path d="M 818 195 L 818 245 Q 818 260 800 260 L 120 260 Q 102 260 102 245 L 102 195"
        fill="none" stroke="#6b1d1d" stroke-width="1.2" class="feedback-flow" marker-end="url(#arrowDim)"/>
  <path d="M 818 195 L 818 245 Q 818 260 800 260 L 120 260 Q 102 260 102 245 L 102 195"
        fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity=".5" class="flow-line-slow"/>

  <text x="460" y="278" class="mono muted" text-anchor="middle">⟲ continuous retrain loop · model feedback</text>

  <!-- ═══════════ CONNECTION LINES ═══════════ -->
  <g fill="none" stroke-width="1.5" filter="url(#glow)">
    <line x1="174" y1="145" x2="208" y2="145" stroke="#ff4545" class="flow-line" marker-end="url(#arrow)"/>
    <line x1="353" y1="145" x2="387" y2="145" stroke="#ff4545" class="flow-line" marker-end="url(#arrow)"/>
    <line x1="532" y1="145" x2="566" y2="145" stroke="#d946ef" class="flow-line" marker-end="url(#arrow)"/>
    <line x1="711" y1="145" x2="745" y2="145" stroke="#a855f7" class="flow-line" marker-end="url(#arrowPurple)"/>
  </g>

  <!-- ═══════════ TRAVELING PARTICLES ═══════════ -->
  <g>
    <circle r="2.5" fill="#ff7777" filter="url(#glowStrong)">
      <animateMotion dur="0.9s" repeatCount="indefinite" begin="0s" path="M 174 145 L 208 145"/>
    </circle>
    <circle r="2.5" fill="#ff7777" filter="url(#glowStrong)">
      <animateMotion dur="0.9s" repeatCount="indefinite" begin="0.225s" path="M 353 145 L 387 145"/>
    </circle>
    <circle r="2.5" fill="#e060e0" filter="url(#glowStrong)">
      <animateMotion dur="0.9s" repeatCount="indefinite" begin="0.45s" path="M 532 145 L 566 145"/>
    </circle>
    <circle r="2.5" fill="#c060ff" filter="url(#glowStrong)">
      <animateMotion dur="0.9s" repeatCount="indefinite" begin="0.675s" path="M 711 145 L 745 145"/>
    </circle>
  </g>

  <!-- ═══════════ STAGE NODES ═══════════ -->
  <!-- INGEST -->
  <g>
    <rect x="32" y="100" width="140" height="90" rx="4" fill="#130a0a" stroke="url(#nodeBorderRed)" stroke-width="1.5" class="border-pulse"/>
    <text x="102" y="92" class="mono stage-index" text-anchor="middle">01 / INGEST</text>
    <text x="102" y="128" class="mono stage-name" text-anchor="middle">INGEST</text>
    <text x="102" y="143" class="mono stage-sub" text-anchor="middle">raw sensor feed</text>
    <line x1="48" y1="152" x2="156" y2="152" stroke="#351414"/>
    <text x="102" y="168" class="mono stage-metric" text-anchor="middle">12.4 MB/s</text>
  </g>

  <!-- CLEAN -->
  <g>
    <rect x="211" y="100" width="140" height="90" rx="4" fill="#130a0a" stroke="url(#nodeBorderMixed)" stroke-width="1.5" class="border-pulse" style="animation-delay:.4s"/>
    <text x="281" y="92" class="mono stage-index" text-anchor="middle">02 / CLEAN</text>
    <text x="281" y="128" class="mono stage-name" text-anchor="middle">CLEAN</text>
    <text x="281" y="143" class="mono stage-sub" text-anchor="middle">normalize · dedupe</text>
    <line x1="227" y1="152" x2="335" y2="152" stroke="#351414"/>
    <text x="281" y="168" class="mono stage-metric" text-anchor="middle">99.2% valid</text>
  </g>

  <!-- TRAIN -->
  <g>
    <rect x="390" y="100" width="140" height="90" rx="4" fill="#130a0a" stroke="url(#nodeBorderPurple)" stroke-width="1.5" class="border-pulse" style="animation-delay:.8s"/>
    <text x="460" y="92" class="mono stage-index" text-anchor="middle">03 / TRAIN</text>
    <text x="460" y="128" class="mono stage-name" text-anchor="middle">TRAIN</text>
    <text x="460" y="143" class="mono stage-sub" text-anchor="middle">fit · evaluate</text>
    <line x1="406" y1="152" x2="514" y2="152" stroke="#351414"/>
    <text x="460" y="168" class="mono stage-metric" text-anchor="middle">mAP 0.87</text>
  </g>

  <!-- SERVE -->
  <g>
    <rect x="569" y="100" width="140" height="90" rx="4" fill="#130a0a" stroke="url(#nodeBorderMixed)" stroke-width="1.5" class="border-pulse" style="animation-delay:1.2s"/>
    <text x="639" y="92" class="mono stage-index" text-anchor="middle">04 / SERVE</text>
    <text x="639" y="128" class="mono stage-name" text-anchor="middle">SERVE</text>
    <text x="639" y="143" class="mono stage-sub" text-anchor="middle">REST · gRPC</text>
    <line x1="585" y1="152" x2="693" y2="152" stroke="#351414"/>
    <text x="639" y="168" class="mono stage-metric" text-anchor="middle">~42ms p95</text>
  </g>

  <!-- MONITOR (active) -->
  <g>
    <rect x="748" y="100" width="140" height="90" rx="4" fill="#1a0808" stroke="url(#nodeBorderRed)" stroke-width="2" filter="url(#glowStrong)"/>
    <text x="818" y="92" class="mono stage-index" text-anchor="middle">05 / MONITOR</text>
    <text x="818" y="128" class="mono stage-name" text-anchor="middle">MONITOR</text>
    <text x="818" y="143" class="mono stage-sub" text-anchor="middle">metrics · drift</text>
    <line x1="764" y1="152" x2="872" y2="152" stroke="#351414"/>
    <text x="818" y="168" class="mono stage-metric metric-blink" text-anchor="middle">live · alerting</text>
  </g>

  <!-- ═══════════ STATUS STRIP ═══════════ -->
  <line x1="28" y1="310" x2="892" y2="310" stroke="#2a0f0f"/>
  <text x="32" y="332" class="mono muted" letter-spacing="2">SYSTEM STATUS</text>

  <circle cx="36" cy="358" r="3" fill="#ff4545" class="pulse-dot"/>
  <text x="48" y="362" class="mono status-label">PIPELINE</text>
  <text x="180" y="362" class="mono status-value">ACTIVE</text>

  <text x="320" y="362" class="mono status-label">THROUGHPUT</text>
  <text x="460" y="362" class="mono status-value">12.4 MB/s</text>

  <text x="620" y="362" class="mono status-label">UPTIME</text>
  <text x="720" y="362" class="mono status-value">99.97%</text>

  <!-- Animated cycle progress bar -->
  <text x="32" y="400" class="mono status-label">CYCLE</text>
  <rect x="110" y="393" width="690" height="6" rx="3" fill="#2a0f0f" stroke="#351414"/>
  <rect x="110" y="393" height="6" rx="3" fill="url(#flowGrad)">
    <animate attributeName="width" values="0;690;690;0" keyTimes="0;0.7;0.85;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="810" y="400" class="mono muted" font-size="9">auto-retrain</text>

  <!-- Footer -->
  <line x1="28" y1="490" x2="892" y2="490" stroke="#2a0f0f"/>
  <text x="32" y="514" class="mono muted" font-size="9">
    latency ~42ms p95 · all pods healthy · model refresh on drift
  </text>
  <text x="888" y="514" class="mono muted" font-size="9" text-anchor="end">
    rev.2026.10 · 5 stages
  </text>
</svg>
