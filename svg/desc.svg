<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="100%" height="auto" role="img" aria-label="About: developer description">
  <defs>
    <linearGradient id="panelBg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0707"/>
      <stop offset="100%" stop-color="#080606"/>
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; }
      .panel-title { fill: #ff4444; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
      .panel-sub { fill: #885555; font-size: 9px; letter-spacing: 0.5px; }
      .ln { fill: #472626; font-size: 9px; }
      .prompt { fill: #ff6666; font-size: 12px; font-weight: 700; }
      .heading { fill: #f2e2e2; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
      .body { fill: #cfcfcf; font-size: 12px; }
      .body-dim { fill: #a5a5a5; font-size: 12px; }
      .hi { fill: #ff9a9a; font-weight: 700; }
      .sect { fill: #ff4545; font-size: 10px; font-weight: 700; letter-spacing: 2px; }
      .eof { fill: #7a7a7a; font-size: 11px; letter-spacing: 2px; }
      .meta { fill: #6a6a6a; font-size: 9px; letter-spacing: 0.5px; }
      .scan { animation: scan 5s ease-in-out infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes scan { 0%,100%{opacity:.08} 50%{opacity:.28} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @media (prefers-reduced-motion: reduce) { .scan,.cursor { animation: none; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="920" height="600" fill="#080808"/>
  <rect x="1" y="1" width="918" height="598" rx="8" fill="none" stroke="#351414"/>

  <g stroke="#ffffff" stroke-opacity=".022">
    <path d="M0 40H920 M0 80H920 M0 120H920 M0 160H920 M0 200H920
             M0 240H920 M0 280H920 M0 320H920 M0 360H920 M0 400H920
             M0 440H920 M0 480H920 M0 520H920 M0 560H920"/>
  </g>

  <g class="scan" fill="#ff3333">
    <rect x="0" y="0" width="920" height="2"/>
  </g>

  <!-- ═══════════ PANEL ═══════════ -->
  <rect x="16" y="16" width="888" height="568" rx="6"
        fill="url(#panelBg3)" stroke="#351414"/>

  <!-- Title bar -->
  <text x="32" y="40" class="mono panel-title">[ ABOUT.TXT ]</text>
  <text x="888" y="40" class="mono panel-sub" text-anchor="end">~/about.md · utf-8</text>
  <line x1="28" y1="52" x2="892" y2="52" stroke="#2a0f0f"/>

  <!-- Gutter rule -->
  <line x1="74" y1="64" x2="74" y2="556" stroke="#2a0f0f"/>

  <!-- Line numbers -->
  <g class="mono ln" text-anchor="end">
    <text x="58" y="86">01</text>
    <text x="58" y="112">02</text>
    <text x="58" y="134">03</text>
    <text x="58" y="156">04</text>
    <text x="58" y="177">05</text>
    <text x="58" y="198">06</text>
    <text x="58" y="220">07</text>
    <text x="58" y="242">08</text>
    <text x="58" y="263">09</text>
    <text x="58" y="284">10</text>
    <text x="58" y="305">11</text>
    <text x="58" y="326">12</text>
    <text x="58" y="348">13</text>
    <text x="58" y="370">14</text>
    <text x="58" y="391">15</text>
    <text x="58" y="412">16</text>
    <text x="58" y="433">17</text>
    <text x="58" y="455">18</text>
    <text x="58" y="477">19</text>
    <text x="58" y="498">20</text>
    <text x="58" y="519">21</text>
    <text x="58" y="544">22</text>
  </g>

  <!-- ─── Content ─── -->
  <g class="mono">
    <text x="92" y="86" class="prompt">$ cat about.md</text>

    <text x="92" y="112" class="heading">
      # Developer <tspan fill="#885555">·</tspan> builder <tspan fill="#885555">·</tspan> ML &amp; AI
    </text>

    <text x="92" y="156" class="body">
      I build systems that connect data, models, and clean
    </text>
    <text x="92" y="177" class="body">
      web backends — from raw input to a deployed product.
    </text>

    <!-- Section 01 -->
    <text x="92" y="220" class="sect">WHAT_I_DO</text>
    <line x1="186" y1="216" x2="880" y2="216" stroke="#2a0f0f"/>

    <text x="92" y="242" class="body">
      Full-stack work across databases, REST APIs, and modern
    </text>
    <text x="92" y="263" class="body">
      frontend interfaces, shipped with containerized deploys.
    </text>
    <text x="92" y="284" class="body">
      Recent focus is applied <tspan class="hi">ML</tspan> and <tspan class="hi">AI</tspan> — training models,
    </text>
    <text x="92" y="305" class="body">
      evaluating them, and wiring them into real applications.
    </text>

    <!-- Section 02 -->
    <text x="92" y="348" class="sect">CURRENTLY</text>
    <line x1="186" y1="344" x2="880" y2="344" stroke="#2a0f0f"/>

    <text x="92" y="370" class="body">
      Building data-driven applications and an ML pipeline for
    </text>
    <text x="92" y="391" class="body">
      real-world sensing — <tspan class="hi">computer vision</tspan> and model serving.
    </text>
    <text x="92" y="412" class="body-dim">
      Always exploring new tools, frameworks, and model architectures.
    </text>

    <!-- Section 03 -->
    <text x="92" y="455" class="sect">PHILOSOPHY</text>
    <line x1="186" y1="451" x2="880" y2="451" stroke="#2a0f0f"/>

    <text x="92" y="477" class="body">
      Ship small. Measure everything. Keep learning.
    </text>
    <text x="92" y="498" class="body-dim">
      Boring tech that works beats clever tech that doesn't.
    </text>

    <!-- EOF + cursor -->
    <text x="92" y="544" class="eof">-- EOF --</text>
    <rect class="cursor" x="180" y="533" width="8" height="14" fill="#ff4545"/>
  </g>

  <!-- Panel footer -->
  <line x1="28" y1="560" x2="892" y2="560" stroke="#2a0f0f"/>
  <text x="32" y="576" class="mono meta">22 lines · 1.1 KB</text>
  <circle cx="830" cy="573" r="2.5" fill="#ff4545"/>
  <text x="840" y="576" class="mono meta">read-only</text>
</svg>
